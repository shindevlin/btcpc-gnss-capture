[package]
name = "btcpc-gnss-capture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "btcpc-gnss-capture"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
anyhow = "1"
